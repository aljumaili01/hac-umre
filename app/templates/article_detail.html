{% extends "base.html" %}
{% block content %}
  {% set la = article.localized(locale) %}
  <section class="page-head">
    <div class="container">
      <h1 class="h1">{{ la.title }}</h1>
      <p class="lead">{{ article.created_at.strftime("%Y-%m-%d") }}</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="prose">
        {% if article.image_url %}
          <img class="article-hero" src="{{ article.image_url }}" alt="" />
        {% endif %}
        <div class="muted">{{ la.content }}</div>
      </div>
      <div class="form-actions">
        <a class="btn btn-ghost" href="{{ url_for('public.articles_list') }}">{{ t('cta_back') }}</a>
      </div>
    </div>
  </section>
{% endblock %}
