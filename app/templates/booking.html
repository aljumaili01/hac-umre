{% extends "base.html" %}
{% block content %}
  <section class="page-head">
    <div class="container">
      <h1 class="h1">{{ t('booking_title') }}</h1>
      <p class="lead">{{ t('booking_subtitle') }}</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="form-shell">
        <form id="bookingForm" class="form">
          <div class="form-grid">
            <div class="field">
              <label class="label" for="package">{{ t('form_package') }}</label>
              <select class="control" name="package" id="package" required>
                <option value="" disabled {% if not selected_package %}selected{% endif %}>—</option>
                {% for p in packages %}
                  {% set lp = p.localized(locale) %}
                  <option value="{{ p.slug }}" {% if selected_package and selected_package.id == p.id %}selected{% endif %}>
                    {{ lp.title }} • {{ "%.2f"|format(p.price_per_person|float) }} {{ p.currency }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="field">
              <label class="label" for="full_name">{{ t('form_full_name') }}</label>
              <input class="control" type="text" id="full_name" name="full_name" autocomplete="name" required />
            </div>

            <div class="field">
              <label class="label" for="passport_number">{{ t('form_passport') }}</label>
              <input class="control" type="text" id="passport_number" name="passport_number" required />
            </div>

            <div class="field">
              <label class="label" for="phone">{{ t('form_phone') }}</label>
              <input class="control" type="tel" id="phone" name="phone" autocomplete="tel" required />
            </div>

            <div class="field">
              <label class="label" for="people_count">{{ t('form_people') }}</label>
              <input class="control" type="number" id="people_count" name="people_count" min="1" max="50" value="1" required />
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">{{ t('form_submit') }}</button>
            <a class="btn btn-ghost" href="{{ url_for('public.packages') }}">{{ t('cta_view_packages') }}</a>
          </div>
        </form>
      </div>
    </div>
  </section>

  <script>
    window.__bookingI18n = {
      ok: "{{ t('toast_booking_ok') }}",
      err: "{{ t('toast_booking_err') }}"
    };
  </script>
{% endblock %}
