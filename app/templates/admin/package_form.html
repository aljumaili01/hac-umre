{% extends "base.html" %}
{% block content %}
  <section class="page-head">
    <div class="container page-head-row">
      <div>
        <h1 class="h1">{% if mode == 'new' %}{{ t('pkg_add') }}{% else %}{{ t('pkg_edit') }}{% endif %}</h1>
        <p class="lead">{{ t('admin_package_form_help') }}</p>
      </div>
      <div class="admin-actions">
        <a class="btn btn-ghost" href="{{ url_for('admin.packages_list') }}">{{ t('admin_packages') }}</a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="form-shell">
        <form class="form" method="post">
          <div class="form-grid">
            <div class="field">
              <label class="label" for="slug">{{ t('field_slug') }}</label>
              <input class="control" id="slug" name="slug" required value="{{ package.slug if package else '' }}" />
            </div>

            <div class="field">
              <label class="label" for="price_per_person">{{ t('field_price') }}</label>
              <input class="control" id="price_per_person" name="price_per_person" inputmode="decimal" required value="{{ package.price_per_person if package else '0' }}" />
            </div>

            <div class="field">
              <label class="label" for="currency">{{ t('field_currency') }}</label>
              <input class="control" id="currency" name="currency" value="{{ package.currency if package else 'USD' }}" />
            </div>

            <div class="field">
              <label class="label" for="duration_days">{{ t('field_duration') }}</label>
              <input class="control" id="duration_days" name="duration_days" type="number" min="1" value="{{ package.duration_days if package else 7 }}" />
            </div>

            <div class="field span-2">
              <label class="label" for="hotels">{{ t('field_hotels') }}</label>
              <input class="control" id="hotels" name="hotels" value="{{ package.hotels if package else '' }}" />
            </div>

            <div class="field span-2">
              <label class="label" for="inclusions">{{ t('field_inclusions') }}</label>
              <textarea class="control" id="inclusions" name="inclusions" rows="3">{{ package.inclusions if package else '' }}</textarea>
            </div>

            <div class="field">
              <label class="label" for="title_ar">{{ t('field_title_ar') }}</label>
              <input class="control" id="title_ar" name="title_ar" required value="{{ package.title_ar if package else '' }}" />
            </div>
            <div class="field">
              <label class="label" for="title_en">{{ t('field_title_en') }}</label>
              <input class="control" id="title_en" name="title_en" required value="{{ package.title_en if package else '' }}" />
            </div>
            <div class="field">
              <label class="label" for="title_ku">{{ t('field_title_ku') }}</label>
              <input class="control" id="title_ku" name="title_ku" required value="{{ package.title_ku if package else '' }}" />
            </div>

            <div class="field span-2">
              <label class="label" for="description_ar">{{ t('field_desc_ar') }}</label>
              <textarea class="control" id="description_ar" name="description_ar" rows="3" required>{{ package.description_ar if package else '' }}</textarea>
            </div>
            <div class="field span-2">
              <label class="label" for="description_en">{{ t('field_desc_en') }}</label>
              <textarea class="control" id="description_en" name="description_en" rows="3" required>{{ package.description_en if package else '' }}</textarea>
            </div>
            <div class="field span-2">
              <label class="label" for="description_ku">{{ t('field_desc_ku') }}</label>
              <textarea class="control" id="description_ku" name="description_ku" rows="3" required>{{ package.description_ku if package else '' }}</textarea>
            </div>

            <div class="field">
              <label class="checkbox">
                <input type="checkbox" name="is_active" {% if package is none or package.is_active %}checked{% endif %} />
                <span>{{ t('field_active') }}</span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">{{ t('pkg_save') }}</button>
            <a class="btn btn-ghost" href="{{ url_for('admin.packages_list') }}">{{ t('admin_packages') }}</a>
          </div>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
